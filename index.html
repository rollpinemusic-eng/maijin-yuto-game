}

.hero.hit {
  animation: heroShake 0.35s ease;
}

@keyframes heroShake {
  0%   { filter: brightness(2.2); }
  30%  { transform: translateX(-10px) scale(1.01); }
  60%  { transform: translateX(10px) scale(1.01); }
  100% { transform: translateX(0) scale(1); filter: brightness(1); }
}

@media (prefers-reduced-motion: no-preference) {
  .hero {
    animation: heroFlicker 5s ease-in-out infinite;
  }
}

@keyframes heroFlicker {
  0%, 92%, 100% { filter: brightness(1); }
  94% { filter: brightness(1.12); }
  96% { filter: brightness(0.95); }
}

.hero.judging {
  animation: heroJudging 0.3s linear infinite;
}

@keyframes heroJudging {
  0%   { filter: hue-rotate(0deg) brightness(1.05); }
  50%  { filter: hue-rotate(140deg) brightness(1.3); }
  100% { filter: hue-rotate(320deg) brightness(1.05); }
}

.hero-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 40%;
  background: linear-gradient(180deg, rgba(13,6,22,0) 0%, #0d0616 95%);
  pointer-events: none;
}

.title-block {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 2;
  max-width: 58%;
}

.title-eyebrow {
  margin: 0;
  font-size: 15px;
  letter-spacing: 6px;
  color: #d9c6ff;
  text-shadow: 0 0 6px rgba(180, 100, 255, 0.6);
}

.title-main {
  margin: 2px 0 6px;
  font-size: 46px;
  line-height: 1;
  background: linear-gradient(180deg, #e9d5ff 0%, #a855f7 55%, #6d28d9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 18px rgba(168, 85, 247, 0.55);
}

.title-desc {
  margin: 0;
  font-size: 11px;
  line-height: 1.6;
  color: #cdbdea;
  text-shadow: 0 1px 3px #000;
}

.speech-bubble {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2;
  max-width: 40%;
  background: rgba(15, 8, 26, 0.82);
  border: 1px solid rgba(196, 160, 255, 0.35);
  border-radius: 4px 16px 16px 16px;
  padding: 10px 12px;
  backdrop-filter: blur(2px);
}

.speech-bubble p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: #efe6ff;
}

/* ===== HPバー ===== */
.hp-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 4px;
}

.hp-tag {
  font-size: 15px;
  font-weight: 900;
  color: #d9c6ff;
  letter-spacing: 1px;
}

.hp-track {
  flex: 1;
  height: 14px;
  border-radius: 8px;
  background: #1c1030;
  border: 1px solid #4a2f7a;
  overflow: hidden;
}

.hp-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6d28d9, #a78bfa);
  transition: width 0.4s ease;
}

.hp-value {
  font-size: 13px;
  font-weight: 700;
  color: #e9d5ff;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ===== 被弾数(危険度)表示 ===== */
.strike-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 0;
}

.strike-label {
  font-size: 11px;
  font-weight: 700;
  color: #ff8fb3;
  white-space: nowrap;
}

.strike-dots {
  display: flex;
  gap: 5px;
}

.strike-dots .dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #2a1030;
  border: 1px solid #7a3a55;
}

.strike-dots .dot.filled {
  background: #ff2d6a;
  border-color: #ff8fb3;
  box-shadow: 0 0 6px rgba(255, 45, 106, 0.8);
}

.strike-hint {
  font-size: 9.5px;
  color: #7a6a9a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== お題パネル(石板風) ===== */
.stone-panel {
  margin: 12px 14px 0;
  padding: 16px 16px 18px;
  background: linear-gradient(180deg, #1a0f2e 0%, #140a24 100%);
  border: 1px solid #4a2f7a;
  border-radius: 14px;
  box-shadow:
    inset 0 0 0 1px rgba(168, 130, 255, 0.12),
    0 8px 24px rgba(0, 0, 0, 0.4);
  position: relative;
}

.stage-tag {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #b98cff;
}

.odai-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}

.odai-col {
  flex: 1;
  min-width: 0;
}

.odai-label {
  display: inline-block;
  margin: 0 0 6px;
  font-size: 11px;
  font-weight: 700;
  background: #ff2d95;
  color: #fff;
  padding: 2px 10px;
  border-radius: 999px;
}

.odai-text {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.55;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.odai-text.odai-hidden {
  opacity: 0;
  transform: translateY(6px);
}

.portrait-badge {
  position: relative;
  flex-shrink: 0;
  width: 64px;
  height: 70px;
}

.portrait-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #5a3a99;
  display: block;
}

.hanko {
  position: absolute;
  bottom: -6px;
  right: -6px;
  background: #9c1f2e;
  color: #ffe3e3;
  font-size: 9px;
  font-weight: 900;
  padding: 2px 5px;
  border: 1px solid #ffb3b3;
  border-radius: 3px;
  letter-spacing: 1px;
  transform: rotate(-6deg);
}

/* ===== 残り時間 ===== */
.timer-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.timer-label {
  font-size: 11px;
  color: #b9a8d9;
  white-space: nowrap;
}

.timer-number {
  font-size: 16px;
  font-weight: 900;
  min-width: 26px;
  text-align: center;
  color: #a78bfa;
  font-variant-numeric: tabular-nums;
}

.timer-number.low-time {
  color: #ff5d8f;
}

@media (prefers-reduced-motion: no-preference) {
  .timer-number.low-time {
    animation: pulseWarn 0.5s ease-in-out infinite;
  }
}

@keyframes pulseWarn {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.28); }
}

.timer-bar-bg {
  flex: 1;
  height: 7px;
  border-radius: 6px;
  background: #1c1030;
  overflow: hidden;
  border: 1px solid #4a2f7a;
}

.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6d28d9, #a78bfa);
  transition: width 1s linear;
}

.timer-bar-fill.low-time {
  background: linear-gradient(90deg, #ff2d6a, #ff8fb3);
}

/* ===== 回答フォーム ===== */
.answer-label {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: #cdbdea;
}

.answer-input {
  width: 100%;
  min-height: 78px;
  border-radius: 10px;
  border: 1px solid #4a2f7a;
  background: #0d0616;
  color: #fff;
  font-size: 15px;
  padding: 10px 12px;
  resize: none;
  font-family: inherit;
  transition: border-color 0.15s ease;
}

.answer-input:focus {
  outline: none;
  border-color: #b98cff;
}

.answer-input:disabled {
  opacity: 0.6;
}

.answer-input.empty-warning {
  animation: warnShake 0.35s ease;
  border-color: #ff2d95;
}

@keyframes warnShake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}

.char-count {
  text-align: right;
  font-size: 11px;
  color: #7a6a9a;
  margin: 4px 2px 12px;
  font-variant-numeric: tabular-nums;
}

.submit-btn {
  width: 100%;
  border: 1px solid #b98cff;
  border-radius: 12px;
  padding: 15px;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
  box-shadow: 0 4px 0 #4c1d95, 0 8px 16px rgba(109, 40, 217, 0.4);
  cursor: pointer;
  transition: transform 0.1s ease;
}

.submit-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #4c1d95;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: default;
}

/* ===== 判定結果 ===== */
.result-area {
  position: relative;
  text-align: center;
  margin-top: 14px;
  background: #140a24;
  border: 1px solid #ff6ec7;
  border-radius: 12px;
  padding: 14px;
  animation: pop 0.25s ease;
}

@keyframes pop {
  0%   { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.rank-badge {
  margin: 0;
  font-size: 42px;
  font-weight: 900;
  line-height: 1;
  font-family: "Yuji Syuku", serif;
  display: inline-block;
}

.rank-badge.reveal-pop {
  animation: rankReveal 0.5s cubic-bezier(.2, 1.4, .4, 1);
}

@keyframes rankReveal {
  0%   { transform: scale(0.3) rotate(-12deg); opacity: 0; }
  60%  { transform: scale(1.15) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); }
}

.rank-badge.rank-A { color: #ff2d95; text-shadow: 0 0 12px #ff2d95; }
.rank-badge.rank-B { color: #ffd166; }
.rank-badge.rank-C { color: #7fe0ff; }
.rank-badge.rank-D { color: #8888a0; }
.rank-badge.rank-TIMEOUT { color: #ff4444; text-shadow: 0 0 12px #ff4444; font-size: 34px; }

.rank-comment {
  margin: 6px 0 0;
  font-size: 14px;
}

.damage-text {
  margin: 6px 0 0;
  font-size: 15px;
  font-weight: 900;
  color: #ff6ec7;
  letter-spacing: 1px;
}

.result-area:has(.rank-badge.rank-TIMEOUT) {
  border-color: #ff4444;
}

.result-area:has(.rank-badge.rank-TIMEOUT) .damage-text {
  color: #ff4444;
}

.particle-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}

.particle {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffd166;
  transform: translate(-50%, -50%);
  opacity: 1;
  transition: transform 0.6s ease-out, opacity 0.6s ease-out;
}

/* ===== 画面フラッシュ ===== */
.flash-overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 50;
}

.flash-overlay.flash-active {
  animation: flashPulse 0.2s ease-out;
}

.flash-overlay.flash-active.flash-counter {
  background: #ff2d2d;
  animation: flashPulse 0.35s ease-out;
}

@keyframes flashPulse {
  0%   { opacity: 0.85; }
  100% { opacity: 0; }
}

/* ===== 下部ナビゲーション ===== */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 480px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #150c26;
  border-top: 1px solid #4a2f7a;
  z-index: 5;
}

.nav-item {
  border: none;
  background: none;
  padding: 10px 4px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: #7a6a9a;
  font-family: inherit;
}

.nav-icon {
  font-size: 18px;
  line-height: 1;
}

.nav-item.active {
  color: #d9c6ff;
}

.nav-item.active .nav-icon {
  filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.7));
}

.nav-item.disabled {
  opacity: 0.4;
}

/* ===== クリア画面 ===== */
.clear-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 4, 24, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.clear-box {
  text-align: center;
  background: #1a0f2e;
  border: 1px solid #b98cff;
  border-radius: 18px;
  padding: 32px 24px;
  max-width: 340px;
  width: 100%;
  box-shadow: 0 0 40px rgba(168, 85, 247, 0.35);
}

.clear-title {
  margin: 0;
  font-size: 42px;
  font-weight: 900;
  font-family: "Yuji Syuku", serif;
  background: linear-gradient(180deg, #e9d5ff 0%, #a855f7 60%, #6d28d9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.clear-line {
  margin: 10px 0 0;
  font-size: 16px;
  color: #ff8fb3;
}

.clear-desc {
  margin: 6px 0 20px;
  font-size: 14px;
  color: #cdbdea;
}

.retry-btn {
  border: 1px solid #b98cff;
  border-radius: 999px;
  padding: 12px 26px;
  font-size: 15px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(180deg, #8b5cf6, #6d28d9);
  cursor: pointer;
}

/* ===== ゲームオーバー画面(クリア画面の配色を赤系に上書き) ===== */
.gameover-box {
  border-color: #ff4444;
  box-shadow: 0 0 40px rgba(255, 68, 68, 0.35);
}

.gameover-title {
  background: linear-gradient(180deg, #ffb3b3 0%, #ff4444 60%, #a50f0f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.gameover-line {
  color: #ff8080;
}

.gameover-retry-btn {
  border-color: #ff8080;
  background: linear-gradient(180deg, #ff5252, #a50f0f);
}

@media (min-width: 600px) {
  .app {
    margin-top: 20px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
    min-height: auto;
  }
  .bottom-nav {
    border-radius: 0 0 20px 20px;
  }
}
</style>
</head>

  var currentOdai = null;
  var timerInterval = null;
  var timeLeft = ANSWER_TIME;
  var strikes = 0;

  // ----- DOM取得 -----
  var heroEl = document.getElementById('heroEl');
  var flashOverlay = document.getElementById('flashOverlay');
  var hpBar = document.getElementById('hpBar');
  var hpNumber = document.getElementById('hpNumber');
  var bossLine = document.getElementById('bossLine');
  var odaiText = document.getElementById('odaiText');
  var answerInput = document.getElementById('answerInput');
  var charCount = document.getElementById('charCount');
  var submitBtn = document.getElementById('submitBtn');
  var resultArea = document.getElementById('resultArea');
  var rankBadge = document.getElementById('rankBadge');
  var rankComment = document.getElementById('rankComment');
  var damageText = document.getElementById('damageText');
  var particleLayer = document.getElementById('particleLayer');
  var clearOverlay = document.getElementById('clearOverlay');
  var retryBtn = document.getElementById('retryBtn');
  var gameOverOverlay = document.getElementById('gameOverOverlay');
  var gameOverRetryBtn = document.getElementById('gameOverRetryBtn');
  var timerNumber = document.getElementById('timerNumber');
  var timerBar = document.getElementById('timerBar');
  var strikeDots = document.querySelectorAll('#strikeDots .dot');

  // ----- お題ローテーション -----
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function refillQueue(avoid) {
    var pool = shuffle(ODAI_LIST.slice());
    if (avoid && pool[0] === avoid && pool.length > 1) {
      var tmp = pool[0];
      pool[0] = pool[1];
      pool[1] = tmp;
    }
    odaiQueue = pool;
  }

  function nextOdai() {
    if (odaiQueue.length === 0) refillQueue(lastOdai);
    var next = odaiQueue.shift();
    lastOdai = next;
    return next;
  }

  function setOdai(odai) {
    currentOdai = odai;
    odaiText.classList.add('odai-hidden');
    setTimeout(function () {
      odaiText.textContent = odai.text;
      odaiText.classList.remove('odai-hidden');
    }, 200);
  }

  // ----- 簡易判定(AIが使えないログインなしの環境向けフォールバック) -----
  // 本物のAIではないが、回答の中身を簡単にチェックして点数化する。
  // 「何を書いても甘く判定される」を避けるため、以下を減点/加点する:
  //   - 短すぎる・お題の丸写し・「わからない」等の投げやりな回答 → 大きく減点
  //   - セリフ調(「」)や感嘆符など、大喜利の回答らしい書き方 → 加点
  //   - 上記に加えてランダムなブレを少し混ぜ、運の要素も残す
  var LAZY_ANSWERS = ['わからない', 'わかりません', 'ない', 'なし', '特になし', '普通', 'べつに', '知らない', 'しらない', 'なんでもいい', 'どうでもいい', 'とくになし'];

  function normalizeForCheck(str) {
    return String(str).replace(/[\s、。！？「」『』\.\,]/g, '');
  }

  function heuristicScore(odaiText, answer) {
    var score = 40; // 基礎点
    var norm = normalizeForCheck(answer);
    var len = norm.length;

    // 文字数による評価(短すぎる投げやりな回答を弾く)
    if (len < 4) score -= 35;
    else if (len < 8) score -= 12;
    else if (len >= 10 && len <= 40) score += 15;
    else if (len > 60) score -= 5;

    // お題をほぼそのまま書き写しただけの回答
    var normOdai = normalizeForCheck(odaiText);
    if (len > 3 && normOdai.indexOf(norm) !== -1) score -= 40;

    // 投げやりな定型回答
    for (var i = 0; i < LAZY_ANSWERS.length; i++) {
      if (norm === normalizeForCheck(LAZY_ANSWERS[i])) { score -= 50; break; }
    }

    // 同じ文字の連打(適当な入力)
    if (/^(.)\1{2,}$/.test(norm)) score -= 50;

    // セリフ調・強調など、大喜利らしい書き方には加点
    if (/[「『].+[」』]/.test(answer)) score += 8;
    if (/[!！?？]/.test(answer)) score += 4;

    // 運のブレ(0〜25点)。同じ傾向の回答でも毎回同じ結果にはならないようにする
    score += Math.random() * 25;

    return score;
  }

  function judgeHeuristically(odaiText, answer) {
    var score = heuristicScore(odaiText, answer);
    if (score >= 78) return 'A';
    if (score >= 55) return 'B';
    if (score >= 30) return 'C';
    return 'D';
  }

  function pickRandom(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // ----- AIに大喜利を採点してもらう(Pollinations.ai, 無料・APIキー不要・ログイン不要) -----
  // Claudeや特定のツールに依存せず、誰でも(このページを開いただけで)本物のAI採点を
  // 試みる。ただし無料の匿名アクセスは混雑時に失敗することがあるため、
  // 失敗・タイムアウト時はnullを返し、呼び出し側で簡易判定にフォールバックする。
  function extractJsonObject(text) {
    try {
      return JSON.parse(text);
    } catch (e) {
      var m = String(text).match(/\{[\s\S]*\}/);
      if (m) {
        try { return JSON.parse(m[0]); } catch (e2) { /* fallthrough */ }
      }
    }
    return null;
  }

  function judgeWithAI(odai, answer) {
    var userPrompt =
      '次の大喜利のお題とプレイヤーの回答を読み、大喜利として本当に面白いかどうかを辛口に採点して。\n' +
      '甘い採点はせず、平凡な回答・お題からズレた回答・意味不明な回答はしっかり低く評価すること。\n' +
      '本当に発想が秀逸で笑える回答だけを高く評価すること。\n\n' +
      'お題:「' + odai.text + '」\n' +
      'プレイヤーの回答:「' + answer + '」\n\n' +
      '次のJSON形式のみで出力して(説明文やコードブロックは付けない):\n' +
      '{"rank":"A","comment":"魔神ゆうとが関西弁でこの回答にツッコむ短いセリフ(20〜40文字程度)"}\n' +
      'rankは A(非常に面白い・独創的) / B(面白い) / C(普通) / D(面白くない・成立していない) のいずれか一文字。';

    var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;

    var fetchP = fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: 'あなたは大喜利ゲームに登場する魔神「ゆうと」。関西弁で話す、尊大で挑発的なキャラクター。指示されたJSON形式のみで回答すること。' },
          { role: 'user', content: userPrompt }
        ],
        temperature: 0.8
      }),
      signal: controller ? controller.signal : undefined
    })
      .then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        var parsed = content ? extractJsonObject(content) : null;
        if (!parsed) throw new Error('no json in response');
        var rank = String(parsed.rank || '').trim().toUpperCase();
        if (['A', 'B', 'C', 'D'].indexOf(rank) === -1) throw new Error('bad rank');
        var comment = typeof parsed.comment === 'string' ? parsed.comment.trim() : '';
        return { rank: rank, comment: comment || null };
      });

    var timeoutP = new Promise(function (resolve) {
      setTimeout(function () {
        if (controller) controller.abort();
        resolve(null);
      }, AI_TIMEOUT_MS);
    });

    return Promise.race([fetchP, timeoutP]).catch(function () {
      return null;
    });
  }

  // ----- HPバーの表示更新 -----
  function updateHpDisplay() {
    var ratio = Math.max(currentHp, 0) / MAX_HP * 100;
    hpBar.style.width = ratio + '%';
    hpNumber.textContent = Math.max(currentHp, 0) + ' / ' + MAX_HP;
  }

  // ----- 危険度(被弾数)の表示更新 -----
  function updateStrikeDisplay() {
    for (var i = 0; i < strikeDots.length; i++) {
      strikeDots[i].classList.toggle('filled', i < strikes);
    }
  }

  // ----- 残り時間タイマー -----
  function updateTimerDisplay() {
    var shown = Math.max(timeLeft, 0);
    timerNumber.textContent = shown;
    timerBar.style.width = (shown / ANSWER_TIME * 100) + '%';
    var low = shown <= 10;
    timerNumber.classList.toggle('low-time', low);
    timerBar.classList.toggle('low-time', low);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeLeft = ANSWER_TIME;
    updateTimerDisplay();
    timerInterval = setInterval(function () {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  // ----- 文字数カウンター -----
  answerInput.addEventListener('input', function () {
    charCount.textContent = answerInput.value.length;
  });

  // ----- 時間切れ:魔神の反撃(模範回答を突きつけてくる) -----
  function handleTimeout() {
    if (isJudging) return;
    isJudging = true;
    submitBtn.disabled = true;
    answerInput.disabled = true;

    flashCounter();

    resultArea.hidden = false;
    rankBadge.textContent = '⏰';
    rankBadge.className = 'rank-badge rank-TIMEOUT';
    void rankBadge.offsetWidth;
    rankBadge.classList.add('reveal-pop');
    rankComment.textContent = '時間切れや！模範解答、教えたるわ。「' + currentOdai.model + '」';
    damageText.textContent = 'カウンター攻撃！';

    bossLine.textContent = '「時間切れやな。模範解答はこれや。『' + currentOdai.model + '』…情けないのう！」';

    heroEl.classList.remove('hit');
    void heroEl.offsetWidth;
    heroEl.classList.add('hit');

    registerStrike();
  }

  // ----- 回答送信時の処理 -----
  function handleSubmit() {
    if (isJudging) return;

    var answer = answerInput.value.trim();
    if (answer === '') {
      answerInput.focus();
      answerInput.classList.remove('empty-warning');
      void answerInput.offsetWidth;
      answerInput.classList.add('empty-warning');
      answerInput.placeholder = '回答を入力してから送信してください！';
      return;
    }

    isJudging = true;
    stopTimer();
    submitBtn.disabled = true;
    answerInput.disabled = true;
    submitBtn.textContent = 'ジャッジ中…';
    heroEl.classList.add('judging');

    var odaiAtSubmit = currentOdai;

    judgeWithAI(odaiAtSubmit, answer).then(function (aiResult) {
      heroEl.classList.remove('judging');
      flashOverlay.classList.remove('flash-active');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-active');

      if (aiResult) {
        applyJudgeResult(aiResult.rank, aiResult.comment);
      } else {
        // AI判定が使えない(未ログイン等)場合は簡易判定にフォールバック
        applyJudgeResult(judgeHeuristically(odaiAtSubmit.text, answer), null);
      }
    });
  }

  // ----- 判定結果をゲームに反映 -----
  function applyJudgeResult(rank, aiComment) {
    var info = RANK_TABLE[rank];

    currentHp = Math.max(currentHp - info.damage, 0);
    updateHpDisplay();

    var comment = aiComment || pickRandom(info.comments);

    resultArea.hidden = false;
    rankBadge.textContent = rank;
    rankBadge.className = 'rank-badge rank-' + rank;
    void rankBadge.offsetWidth;
    rankBadge.classList.add('reveal-pop');

    rankComment.textContent = comment;
    damageText.textContent = info.damage > 0 ? ('-' + info.damage + ' DAMAGE') : 'NO DAMAGE';

    // 魔神の吹き出しには、その回答へのAIの感想(関西弁)をそのまま表示する
    bossLine.textContent = '「' + comment + '」';

    if (info.damage > 0) {
      heroEl.classList.remove('hit');
      void heroEl.offsetWidth;
      heroEl.classList.add('hit');
    }

    if (rank === 'A') {
      spawnParticles();
    }

    if (currentHp <= 0) {
      strikes = 0;
      updateStrikeDisplay();
      setTimeout(showClear, RESULT_DISPLAY_MS);
      return;
    }

    if (rank === 'D') {
      // 面白くない回答は攻撃にならないだけでなく、被弾としてもカウントする
      registerStrike();
    } else {
      strikes = 0;
      updateStrikeDisplay();
      setTimeout(goToNextRound, RESULT_DISPLAY_MS);
    }
  }

  // ----- 被弾(タイムアップ or 面白くない回答)を記録し、3回でゲームオーバー -----
  function registerStrike() {
    strikes++;
    updateStrikeDisplay();

    if (strikes >= MAX_STRIKES) {
      setTimeout(showGameOver, RESULT_DISPLAY_MS);
    } else {
      setTimeout(goToNextRound, RESULT_DISPLAY_MS);
    }
  }

  // ----- 演出:カウンター攻撃を受けた際の赤い画面フラッシュ -----
  function flashCounter() {
    flashOverlay.classList.remove('flash-active', 'flash-counter');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('flash-active', 'flash-counter');
  }

  // ----- 演出:ランクA達成時のパーティクル -----
  function spawnParticles() {
    for (var i = 0; i < 10; i++) {
      (function (index) {
        var p = document.createElement('span');
        p.className = 'particle';
        particleLayer.appendChild(p);

        var angle = (Math.PI * 2 / 10) * index;
        var dist = 70;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;

        requestAnimationFrame(function () {
          p.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.2)';
          p.style.opacity = '0';
        });

        setTimeout(function () {
          if (p.parentNode) p.parentNode.removeChild(p);
        }, 650);
      })(i);
    }
  }

  // ----- 次の問題へ -----
  function goToNextRound() {
    resultArea.hidden = true;
    isJudging = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '回答する';
    answerInput.disabled = false;
    answerInput.value = '';
    answerInput.placeholder = 'ここに面白い回答を入力…';
    charCount.textContent = '0';

    setOdai(nextOdai());
    startTimer();
  }

  // ----- クリア画面表示 -----
  function showClear() {
    clearOverlay.hidden = false;
  }

  // ----- ゲームオーバー画面表示 -----
  function showGameOver() {
    gameOverOverlay.hidden = false;
  }

  // ----- リトライ処理(共通) -----
  function resetGame() {
    currentHp = MAX_HP;
    strikes = 0;
    updateHpDisplay();
    updateStrikeDisplay();
    resultArea.hidden = true;
    clearOverlay.hidden = true;
    gameOverOverlay.hidden = true;
    isJudging = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '回答する';
    answerInput.disabled = false;
    answerInput.value = '';
    answerInput.placeholder = 'ここに面白い回答を入力…';
    charCount.textContent = '0';
    bossLine.textContent = '「フハハハハ…挑戦者よ…その大喜利、俺を笑わせることができるかな?」';

    lastOdai = null;
    odaiQueue = [];
    setOdai(nextOdai());
    startTimer();
  }

  // ----- イベント登録 -----
  submitBtn.addEventListener('click', handleSubmit);

  answerInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSubmit();
    }
  });

  retryBtn.addEventListener('click', resetGame);
  gameOverRetryBtn.addEventListener('click', resetGame);

  // ----- 初期表示 -----
  currentOdai = ODAI_LIST[0];
  updateHpDisplay();
  updateStrikeDisplay();
  startTimer();
})();
</script>
</body>
</html>
