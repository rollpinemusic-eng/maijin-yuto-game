<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>魔神ゆうと ～大喜利ダンジョン～</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0d0616;
    color: #f3eefc;
    font-family: "Zen Maru Gothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 48px;
  }
  .title-main {
    font-family: "Yuji Syuku", "Zen Maru Gothic", serif;
    text-align: center;
    font-size: 34px;
    margin: 0 0 4px;
    background: linear-gradient(180deg, #ffd700 0%, #ff6ec7 60%, #8b5cf6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #c9b8ea;
    margin: 0 0 32px;
    letter-spacing: 0.05em;
  }
  .stage-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(180deg, rgba(139,92,246,0.16), rgba(20,10,35,0.5));
    border: 1px solid rgba(185,140,255,0.35);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
  }
  .stage-card.locked {
    opacity: 0.55;
    filter: grayscale(0.6);
    pointer-events: none;
  }
  .stage-portrait {
    width: 64px;
    height: 68px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .stage-info { flex: 1; min-width: 0; }
  .stage-num {
    display: inline-block;
    font-size: 10px;
    font-weight: 900;
    background: #ff2d95;
    color: #fff;
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 4px;
  }
  .stage-name {
    font-family: "Yuji Syuku", serif;
    font-size: 19px;
    margin: 0 0 2px;
  }
  .stage-desc {
    font-size: 12px;
    color: #cbb9ec;
    margin: 0;
  }
  .stage-status {
    font-size: 11px;
    font-weight: 700;
    color: #ffd700;
    flex-shrink: 0;
    text-align: right;
    white-space: nowrap;
  }
  .stage-status.lock-label { color: #9a8ab8; }
  .footer-note {
    text-align: center;
    font-size: 11px;
    color: #8a76ad;
    margin-top: 28px;
    line-height: 1.7;
  }
  .bottom-nav {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #150c26;
    border-top: 1px solid #4a2f7a;
    z-index: 5;
  }
  .nav-item {
    border: none;
    background: none;
    padding: 8px 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #7a6a9a;
    font-family: inherit;
  }
  .nav-icon { font-size: 16px; line-height: 1; }
  .nav-item.active { color: #d9c6ff; }
  .nav-item.active .nav-icon { filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.7)); }
  .nav-item.disabled { opacity: 0.4; }
  .wrap { padding-bottom: 78px; } /* 下部メニュー分の余白 */
</style>
</head>
