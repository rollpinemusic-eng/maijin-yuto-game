/* スマホの画面1枚にゲーム全体が収まるように、appを画面の高さぴったりで

  max-width: 480px;
  margin: 0 auto;

  height: 100dvh;
  background: #0d0616;
  padding-bottom: 70px; /* 下部ナビの高さ分 */

  flex-direction: column;
  overflow: hidden;
}

.hero.hit {
  animation: heroShake 0.5s cubic-bezier(.36,.07,.19,.97);
}

@keyframes heroShake {
  0%   { filter: brightness(3) saturate(1.6) hue-rotate(-10deg); transform: scale(1.08); }
  15%  { transform: translate(-14px, 4px) scale(1.06) rotate(-3deg); }
  30%  { transform: translate(12px, -6px) scale(1.06) rotate(3deg); }
  45%  { transform: translate(-9px, 3px) scale(1.03) rotate(-2deg); }
  60%  { transform: translate(7px, -3px) scale(1.02) rotate(1deg); filter: brightness(1.4) saturate(1.2); }
  80%  { transform: translate(-3px, 1px) scale(1.005); }
  100% { transform: translate(0, 0) scale(1) rotate(0deg); filter: brightness(1) saturate(1); }
}

/* 魔神が反撃してくる瞬間(こちらへ迫ってくるような演出) */
.hero.counter-attacking {
  animation: heroCounterAttack 0.7s cubic-bezier(.3,.1,.2,1);
}

@keyframes heroCounterAttack {
  0%   { transform: scale(1); filter: brightness(1) saturate(1); }
  25%  { transform: scale(1.2) translateY(-3%); filter: brightness(1.8) saturate(1.6) contrast(1.35) hue-rotate(-8deg); }
  50%  { transform: scale(1.13) translateY(1%) rotate(-1.5deg); filter: brightness(1.3) saturate(1.3); }
  70%  { transform: scale(1.08) rotate(1deg); }
  100% { transform: scale(1) translateY(0) rotate(0deg); filter: brightness(1) saturate(1); }
}

/* 魔神が怒り/焦り/激怒/絶望の色をまとう(表情差分の代わりに色とグロウで感情を表現) */
.hero-glow-overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: hard-light;
}

.hero.mood-anger .hero-glow-overlay {
  background: radial-gradient(circle at 50% 40%, rgba(255,40,20,0.9) 0%, rgba(255,40,20,0.35) 55%, transparent 78%);
  opacity: 1;
  transition: opacity 0.2s ease;
}

.hero.mood-rage .hero-glow-overlay,
.hero.mood-pain .hero-glow-overlay {
  background: radial-gradient(circle at 50% 40%, rgba(255,0,0,1) 0%, rgba(255,0,0,0.5) 55%, transparent 80%);
  opacity: 1;
}

@media (prefers-reduced-motion: no-preference) {
  .hero.mood-rage .hero-glow-overlay { animation: ragePulse 0.35s ease-in-out infinite; }
}
@keyframes ragePulse {
  0%, 100% { opacity: 0.8; }
  50%      { opacity: 1; }
}

.hero.mood-low .hero-glow-overlay {
  background: radial-gradient(circle at 50% 60%, rgba(255,110,20,0.65) 0%, transparent 72%);
  opacity: 1;
}
@media (prefers-reduced-motion: no-preference) {
  .hero.mood-low .hero-glow-overlay { animation: worryPulse 1.1s ease-in-out infinite; }
}
@keyframes worryPulse {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 0.85; }
}

.hero.mood-despair .hero-glow-overlay {
  background: radial-gradient(circle at 50% 50%, rgba(60,60,80,0.85) 0%, transparent 78%);
  opacity: 1;
  transition: opacity 1s ease;
}

.hero.mood-smirk .hero-glow-overlay {
  background: radial-gradient(circle at 50% 40%, rgba(255,209,102,0.5) 0%, transparent 70%);
  opacity: 1;
  transition: opacity 0.2s ease;
}

/* 表情バッジ(絵文字で「今どういう感情か」を誰が見ても分かるようにする) */
.mood-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 8;
  font-size: 34px;
  line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
  opacity: 0;
  transform: scale(0.3) rotate(-15deg);
  pointer-events: none;
}

.mood-badge.show {
  animation: moodBadgePop 0.35s cubic-bezier(.3,1.6,.4,1) forwards;
}

@keyframes moodBadgePop {
  0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
  60%  { opacity: 1; transform: scale(1.25) rotate(6deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.mood-badge.persist {
  animation: moodBadgePop 0.35s cubic-bezier(.3,1.6,.4,1) forwards, moodBadgeBob 0.9s ease-in-out 0.35s infinite;
}

@keyframes moodBadgeBob {
  0%, 100% { transform: scale(1) translateY(0); }
  50%      { transform: scale(1) translateY(-4px); }
}

/* 魔神撃破演出:大爆発→吹き飛び→消滅(数秒かけて) */
.hero.defeated {
  animation: heroDefeat 3.2s cubic-bezier(.4,0,.2,1) forwards;
}

@keyframes heroDefeat {
  0%   { transform: none; filter: none; }
  6%   { transform: translate(-18px, 2px) rotate(-5deg); filter: brightness(1.4); }
  13%  { transform: translate(16px, -4px) rotate(4deg); }
  20%  { transform: translate(-14px, 4px) rotate(-3deg); filter: brightness(2.2) saturate(1.6); }
  27%  { transform: translate(10px, -3px) rotate(2deg); }
  34%  { transform: scale(1.12); filter: brightness(3.5) contrast(1.4) saturate(0.3); }
  42%  { transform: scale(1.05) translateY(-2%); filter: brightness(1) grayscale(0.3); }
  55%  { transform: scale(0.98) translateY(2%) rotate(-2deg); filter: grayscale(0.7) brightness(0.8); }
  100% { transform: translateY(-260%) translateX(18%) rotate(-25deg) scale(0.4); filter: grayscale(1) brightness(0.6); opacity: 0; }
}

/* 被弾時の効果線(コミック風インパクト) */
.impact-burst {
  position: absolute;
  inset: -20%;
  z-index: 4;
  pointer-events: none;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.95) 0deg 3deg, transparent 3deg 14deg);
  opacity: 0;
  transform: scale(0.2);
  mix-blend-mode: screen;
}

.impact-burst.play {
  animation: impactBurstPlay 0.5s cubic-bezier(.15,.8,.3,1) forwards;
}

@keyframes impactBurstPlay {
  0%   { opacity: 0; transform: scale(0.15); }
  12%  { opacity: 0.95; transform: scale(0.55); }
  45%  { opacity: 0.65; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.5); }
}

/* 被弾時の大げさなセリフ文字(「ぐはっ!!」等) */
.impact-text {
  position: absolute;
  left: 50%;
  top: 42%;
  z-index: 6;
  transform: translate(-50%, -50%) scale(0.3) rotate(-8deg);
  font-family: "Yuji Syuku", serif;
  font-size: clamp(28px, 9vw, 46px);
  color: #fff;
  -webkit-text-stroke: 2px #ff2d6a;
  text-shadow: 3px 3px 0 #ff2d6a, -2px -2px 0 #ff2d6a, 0 0 22px rgba(255,45,106,0.9);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
}

.impact-text.play {
  animation: impactTextPlay 0.85s cubic-bezier(.2,1.6,.4,1) forwards;
}

@keyframes impactTextPlay {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-10deg); }
  20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(4deg); }
  35%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
  75%  { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translate(-50%, -75%) scale(0.9) rotate(0deg); }
}

/* 撃破時の断末魔の叫び(吹き飛びに合わせて大きく長めに表示) */
.scream-text {
  position: absolute;
  left: 50%;
  top: 40%;
  z-index: 7;
  transform: translate(-50%, -50%) scale(0.2);
  font-family: "Yuji Syuku", serif;
  font-size: clamp(32px, 11vw, 54px);
  color: #fff;
  -webkit-text-stroke: 2.5px #ff0000;
  text-shadow: 4px 4px 0 #ff0000, -3px -3px 0 #ff0000, 0 0 30px rgba(255,0,0,0.95);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
}

.scream-text.play {
  animation: screamPlay 1.6s cubic-bezier(.2,1.3,.3,1) forwards;
}

@keyframes screamPlay {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-6deg); }
  18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.4) rotate(3deg); }
  35%  { opacity: 1; transform: translate(-50%, -55%) scale(1.15) rotate(-2deg); }
  70%  { opacity: 1; transform: translate(-50%, -110%) scale(1.05) rotate(-8deg); }
  100% { opacity: 0; transform: translate(-50%, -180%) scale(0.85) rotate(-16deg); }
}

@media (prefers-reduced-motion: no-preference) {
  .hero {
    animation: heroFlicker 5s ease-in-out infinite;
  }
}

@keyframes heroFlicker {
  0%, 92%, 100% { filter: brightness(1); }
  94% { filter: brightness(1.12); }
  96% { filter: brightness(0.95); }
}

.hero.judging {
  animation: heroJudging 0.3s linear infinite;
}

@keyframes heroJudging {
  0%   { filter: hue-rotate(0deg) brightness(1.05); }
  50%  { filter: hue-rotate(140deg) brightness(1.3); }
  100% { filter: hue-rotate(320deg) brightness(1.05); }
}

.hero-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 40%;
  background: linear-gradient(180deg, rgba(13,6,22,0) 0%, #0d0616 95%);
  pointer-events: none;
}

/* 魔神が放つ闇の魔力弾(反撃演出:プレイヤーへ飛んでいく) */
.dark-orb {
  position: absolute;
  top: 0;
  left: 0;
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff0ff 0%, #ff5ef7 22%, #c026ff 45%, #6d0fbf 72%, #14001f 100%);
  box-shadow: 0 0 30px 12px rgba(255, 45, 214, 0.95), 0 0 60px 24px rgba(150, 0, 255, 0.6);
  z-index: 16;
  pointer-events: none;
  opacity: 0;
  transform: translate(0, 0) scale(0.25);
}

.dark-orb.launch {
  opacity: 1;
  transition: transform 0.48s cubic-bezier(.5,0,.85,.3), opacity 0.1s ease;
}

@media (prefers-reduced-motion: no-preference) {
  .dark-orb.launch {
    animation: orbPulse 0.18s ease-in-out infinite;
  }
}

@keyframes orbPulse {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.6); }
}

.title-block {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 2;
  max-width: 58%;
}

.title-eyebrow {
  margin: 0;
  font-size: 15px;
  letter-spacing: 6px;
  color: #d9c6ff;
  text-shadow: 0 0 6px rgba(180, 100, 255, 0.6);
}

.title-main {
  margin: 2px 0 6px;
  font-size: 46px;
  line-height: 1;
  background: linear-gradient(180deg, #e9d5ff 0%, #a855f7 55%, #6d28d9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 18px rgba(168, 85, 247, 0.55);
}

.title-desc {
  margin: 0;
  font-size: 11px;
  line-height: 1.6;
  color: #cdbdea;
  text-shadow: 0 1px 3px #000;
}

.speech-bubble {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2;
  max-width: 40%;
  background: rgba(15, 8, 26, 0.82);
  border: 1px solid rgba(196, 160, 255, 0.35);
  border-radius: 4px 16px 16px 16px;
  padding: 10px 12px;
  backdrop-filter: blur(2px);
}

.speech-bubble p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: #efe6ff;
}

/* ===== HPバー ===== */
.hp-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
}

.player-hp-row {
  padding-top: 0;
}

/* プレイヤーが被弾した瞬間、HP行そのものを光らせて「今やられた」と分かるようにする */
.player-hp-row.hit-flash {
  animation: playerHitFlash 0.5s ease-out;
}

@keyframes playerHitFlash {
  0%   { background: rgba(255, 30, 30, 0.55); transform: translateX(0); }
  15%  { transform: translateX(-5px); }
  30%  { transform: translateX(5px); }
  45%  { transform: translateX(-3px); }
  100% { background: rgba(255, 30, 30, 0); transform: translateX(0); }
}

.hp-tag {
  font-size: 14px;
  font-weight: 900;
  color: #d9c6ff;
  letter-spacing: 1px;
  min-width: 34px;
}

.you-tag {
  color: #7fe6c4;
}

.hp-track {
  flex: 1;
  height: 14px;
  border-radius: 8px;
  background: #1c1030;
  border: 1px solid #4a2f7a;
  overflow: hidden;
}

.hp-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6d28d9, #a78bfa);
  transition: width 0.4s ease;
}

.player-hp-track {
  height: 10px;
}

.player-hp-fill {
  background: linear-gradient(90deg, #0d9488, #5eead4);
}

.player-hp-fill.low {
  background: linear-gradient(90deg, #ff2d2d, #ff9f6e);
}

@media (prefers-reduced-motion: no-preference) {
  .player-hp-fill.low {
    animation: playerLowPulse 0.7s ease-in-out infinite;
  }
}

@keyframes playerLowPulse {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.5); }
}

.hp-value {
  font-size: 12px;
  font-weight: 700;
  color: #e9d5ff;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ===== 被弾リスク(3回連続不発で魔神の反撃)。HP行の右端に添える ===== */
.strike-dots {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

.strike-dots .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #2a1030;
  border: 1px solid #7a3a55;
}

.strike-dots .dot.filled {
  background: #ff2d6a;
  border-color: #ff8fb3;
  box-shadow: 0 0 6px rgba(255, 45, 106, 0.8);
}

/* ===== お題パネル(石板風) ===== */
.stone-panel {
  margin: 6px 14px 0;
  padding: 12px 14px 14px;
  flex-shrink: 0;
  background: linear-gradient(180deg, #1a0f2e 0%, #140a24 100%);
  border: 1px solid #4a2f7a;
  border-radius: 14px;
  box-shadow:
    inset 0 0 0 1px rgba(168, 130, 255, 0.12),
    0 8px 24px rgba(0, 0, 0, 0.4);
  position: relative;
}

.stage-tag {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #b98cff;
}

.odai-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}

.odai-col {
  flex: 1;
  min-width: 0;
}

.odai-label {
  display: inline-block;
  margin: 0 0 6px;
  font-size: 11px;
  font-weight: 700;
  background: #ff2d95;
  color: #fff;
  padding: 2px 10px;
  border-radius: 999px;
}

.odai-text {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.55;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.odai-text.odai-hidden {
  opacity: 0;
  transform: translateY(6px);
}

.portrait-badge {
  position: relative;
  flex-shrink: 0;
  width: 52px;
  height: 56px;
}

.portrait-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #5a3a99;
  display: block;
}

.hanko {
  position: absolute;
  bottom: -6px;
  right: -6px;
  background: #9c1f2e;
  color: #ffe3e3;
  font-size: 9px;
  font-weight: 900;
  padding: 2px 5px;
  border: 1px solid #ffb3b3;
  border-radius: 3px;
  letter-spacing: 1px;
  transform: rotate(-6deg);
}

/* ===== 残り時間 ===== */
.timer-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.timer-label {
  font-size: 11px;
  color: #b9a8d9;
  white-space: nowrap;
}

.timer-number {
  font-size: 16px;
  font-weight: 900;
  min-width: 26px;
  text-align: center;
  color: #a78bfa;
  font-variant-numeric: tabular-nums;
}

.timer-number.low-time {
  color: #ff5d8f;
}

@media (prefers-reduced-motion: no-preference) {
  .timer-number.low-time {
    animation: pulseWarn 0.5s ease-in-out infinite;
  }
}

@keyframes pulseWarn {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.28); }
}

.timer-bar-bg {
  flex: 1;
  height: 7px;
  border-radius: 6px;
  background: #1c1030;
  overflow: hidden;
  border: 1px solid #4a2f7a;
}

.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6d28d9, #a78bfa);
  transition: width 1s linear;
}

.timer-bar-fill.low-time {
  background: linear-gradient(90deg, #ff2d6a, #ff8fb3);
}

/* ===== 回答フォーム ===== */
.answer-label {
  margin: 0 0 4px;
  font-size: 11px;
  font-weight: 700;
  color: #cdbdea;
}

.answer-input {
  width: 100%;
  min-height: 48px;
  border-radius: 10px;
  border: 1px solid #4a2f7a;
  background: #0d0616;
  color: #fff;
  font-size: 15px;
  padding: 8px 12px;
  resize: none;
  font-family: inherit;
  transition: border-color 0.15s ease;
}

.answer-input:focus {
  outline: none;
  border-color: #b98cff;
}

.answer-input:disabled {
  opacity: 0.6;
}

.answer-input.empty-warning {
  animation: warnShake 0.35s ease;
  border-color: #ff2d95;
}

@keyframes warnShake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-6px); }
  75%      { transform: translateX(6px); }
}

.char-count {
  text-align: right;
  font-size: 10px;
  color: #7a6a9a;
  margin: 2px 2px 6px;
  font-variant-numeric: tabular-nums;
}

.submit-btn {
  width: 100%;
  border: 1px solid #b98cff;
  border-radius: 12px;
  padding: 11px;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
  box-shadow: 0 4px 0 #4c1d95, 0 8px 16px rgba(109, 40, 217, 0.4);
  cursor: pointer;
  transition: transform 0.1s ease;
}

.submit-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #4c1d95;
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: default;
}

/* ===== 判定結果:画面中央に大きく出す演出オーバーレイ ===== */
.result-area {
  position: fixed;
  inset: 0;
  z-index: 45;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: rgba(5, 2, 10, 0.72);
  backdrop-filter: blur(1px);
  animation: overlayFadeIn 0.2s ease;
}

@keyframes overlayFadeIn {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}

.result-card {
  position: relative;
  padding: 24px 30px 22px;
  border-radius: 22px;
  background: linear-gradient(180deg, #1a0f2e 0%, #100821 100%);
  border: 2px solid #ff6ec7;
  box-shadow: 0 0 60px rgba(255, 110, 199, 0.35), 0 20px 50px rgba(0,0,0,0.6);
  max-width: 260px;
  width: calc(100% - 56px);
  animation: pop 0.3s cubic-bezier(.25,1.3,.4,1);
}

@keyframes pop {
  0%   { transform: scale(0.75); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.rank-badge {
  margin: 0;
  font-size: 92px;
  font-weight: 900;
  line-height: 1;
  font-family: "Yuji Syuku", serif;
  display: inline-block;
}

.rank-badge.reveal-pop {
  animation: rankReveal 0.6s cubic-bezier(.2, 1.5, .35, 1);
}

@keyframes rankReveal {
  0%   { transform: scale(0.2) rotate(-18deg); opacity: 0; }
  55%  { transform: scale(1.25) rotate(6deg); opacity: 1; }
  75%  { transform: scale(0.95) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* A: 金色・発光・超派手 */
.rank-badge.rank-A {
  color: #ffe066;
  text-shadow: 0 0 18px #ffd700, 0 0 40px #ff9f1c, 0 0 70px #ff9f1c;
}
.result-card.theme-A { border-color: #ffd700; box-shadow: 0 0 80px rgba(255, 215, 0, 0.5), 0 20px 50px rgba(0,0,0,0.6); }
@media (prefers-reduced-motion: no-preference) {
  .rank-badge.rank-A { animation-name: rankReveal, rankAGlow; animation-duration: 0.6s, 1s; animation-iteration-count: 1, 3; animation-delay: 0s, 0.6s; }
}
@keyframes rankAGlow {
  0%, 100% { text-shadow: 0 0 18px #ffd700, 0 0 40px #ff9f1c, 0 0 70px #ff9f1c; }
  50% { text-shadow: 0 0 30px #fff3b0, 0 0 60px #ffd700, 0 0 100px #ff9f1c; }
}

/* B: 青系・爽快感 */
.rank-badge.rank-B { color: #7dd3fc; text-shadow: 0 0 16px #38bdf8, 0 0 34px #0ea5e9; }
.result-card.theme-B { border-color: #38bdf8; box-shadow: 0 0 60px rgba(56, 189, 248, 0.4), 0 20px 50px rgba(0,0,0,0.6); }

/* C: 赤系・警告感(手応え不足) */
.rank-badge.rank-C { color: #ffb199; text-shadow: 0 0 14px #f87171, 0 0 28px #ef4444; }
.result-card.theme-C { border-color: #f87171; box-shadow: 0 0 50px rgba(248, 113, 113, 0.35), 0 20px 50px rgba(0,0,0,0.6); }

/* D: 真っ赤な警告表示 */
.rank-badge.rank-D { color: #ff3b3b; text-shadow: 0 0 20px #ff0000, 0 0 46px #ff0000; }
.result-card.theme-D { border-color: #ff2020; box-shadow: 0 0 70px rgba(255, 20, 20, 0.55), 0 20px 50px rgba(0,0,0,0.6); animation: pop 0.3s cubic-bezier(.25,1.3,.4,1), dangerPulse 0.4s ease-in-out 2; }
@keyframes dangerPulse {
  0%, 100% { border-color: #ff2020; }
  50% { border-color: #fff; }
}

.rank-badge.rank-TIMEOUT { color: #ff4444; text-shadow: 0 0 18px #ff4444; font-size: 60px; }
.result-card.theme-TIMEOUT { border-color: #ff4444; }
.result-card.theme-COUNTER { border-color: #ff2020; box-shadow: 0 0 90px rgba(255, 20, 20, 0.6), 0 20px 50px rgba(0,0,0,0.6); }

.damage-text {
  margin: 10px 0 0;
  font-size: 17px;
  font-weight: 900;
  color: #ff6ec7;
  letter-spacing: 1px;
}

.result-card.theme-A .damage-text { color: #ffd700; }
.result-card.theme-B .damage-text { color: #7dd3fc; }
.result-card.theme-C .damage-text { color: #ffb199; }
.result-card.theme-D .damage-text,
.result-card.theme-TIMEOUT .damage-text,
.result-card.theme-COUNTER .damage-text { color: #ff4444; }

.rank-label-tag {
  margin: 0 0 4px;
  font-size: 11px;
  letter-spacing: 4px;
  color: #b9a8d9;
  font-weight: 700;
}

.particle-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: visible;
  z-index: 46;
}

.particle {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffd166;
  transform: translate(-50%, -50%);
  opacity: 1;
  transition: transform 0.6s ease-out, opacity 0.6s ease-out;
}

/* 攻撃・反撃時の衝撃波リング */
.shockwave-ring {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  border-radius: 50%;
  border: 4px solid #ff9fd6;
  pointer-events: none;
  z-index: 20;
  opacity: 0.9;
  transform: scale(0.3);
  transition: transform 0.6s cubic-bezier(.1,.6,.3,1), opacity 0.6s ease-out;
}

.shockwave-ring.expand {
  transform: scale(9);
  opacity: 0;
}

/* 稲妻フリッカー(画面全体) */
.lightning-overlay {
  position: fixed;
  inset: 0;
  z-index: 42;
  pointer-events: none;
  background: linear-gradient(120deg, rgba(255,255,255,0.9), rgba(180,140,255,0.5));
  opacity: 0;
}

.lightning-overlay.flicker {
  animation: lightningFlicker 0.6s steps(1, end) 1;
}

@keyframes lightningFlicker {
  0%   { opacity: 0; }
  8%   { opacity: 0.9; }
  16%  { opacity: 0; }
  24%  { opacity: 0.7; }
  30%  { opacity: 0; }
  45%  { opacity: 0.5; }
  55%  { opacity: 0; }
  100% { opacity: 0; }
}

/* 画面全体の揺れ(大きな演出用) */
.app.shake-heavy { animation: appShakeHeavy 0.6s cubic-bezier(.3,.1,.2,1); }
.app.shake-light { animation: appShakeLight 0.4s ease-out; }

@keyframes appShakeHeavy {
  0%   { transform: translate(0,0) rotate(0); }
  10%  { transform: translate(-10px, 6px) rotate(-1.2deg); }
  20%  { transform: translate(12px, -8px) rotate(1.3deg); }
  32%  { transform: translate(-14px, 5px) rotate(-1.5deg); }
  44%  { transform: translate(10px, -6px) rotate(1deg); }
  56%  { transform: translate(-8px, 4px) rotate(-0.8deg); }
  68%  { transform: translate(6px, -3px) rotate(0.6deg); }
  80%  { transform: translate(-4px, 2px) rotate(-0.3deg); }
  100% { transform: translate(0,0) rotate(0); }
}

@keyframes appShakeLight {
  0%   { transform: translate(0,0); }
  25%  { transform: translate(-6px, 3px); }
  50%  { transform: translate(6px, -3px); }
  75%  { transform: translate(-3px, 2px); }
  100% { transform: translate(0,0); }
}

/* ===== 画面フラッシュ ===== */
.flash-overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 50;
}

.flash-overlay.flash-active {
  animation: flashPulse 0.2s ease-out;
}

.flash-overlay.flash-active.flash-counter {
  background: #ff2d2d;
  animation: flashPulse 0.35s ease-out;
}

.flash-overlay.flash-active.flash-gold {
  background: #ffe066;
  animation: flashPulse 0.3s ease-out;
}

.flash-overlay.flash-active.flash-mega {
  background: #fff;
  animation: flashPulse 0.6s ease-out;
}

@keyframes flashPulse {
  0%   { opacity: 0.85; }
  100% { opacity: 0; }
}

/* ===== 下部ナビゲーション ===== */
.bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 480px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #150c26;
  border-top: 1px solid #4a2f7a;
  z-index: 5;
}

.nav-item {
  border: none;
  background: none;
  padding: 8px 4px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  color: #7a6a9a;
  font-family: inherit;
}

.nav-icon {
  font-size: 16px;
  line-height: 1;
}

.nav-item.active {
  color: #d9c6ff;
}

.nav-item.active .nav-icon {
  filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.7));
}

.nav-item.disabled {
  opacity: 0.4;
}

/* ===== クリア画面 ===== */
.clear-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 4, 24, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.clear-box {
  text-align: center;
  background: #1a0f2e;
  border: 1px solid #b98cff;
  border-radius: 18px;
  padding: 32px 24px;
  max-width: 340px;
  width: 100%;
  box-shadow: 0 0 40px rgba(168, 85, 247, 0.35);
}

.clear-title {
  margin: 0;
  font-size: 42px;
  font-weight: 900;
  font-family: "Yuji Syuku", serif;
  background: linear-gradient(180deg, #e9d5ff 0%, #a855f7 60%, #6d28d9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.clear-line {
  margin: 10px 0 0;
  font-size: 16px;
  color: #ff8fb3;
}

.clear-desc {
  margin: 6px 0 20px;
  font-size: 14px;
  color: #cdbdea;
}

.retry-btn {
  border: 1px solid #b98cff;
  border-radius: 999px;
  padding: 12px 26px;
  font-size: 15px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(180deg, #8b5cf6, #6d28d9);
  cursor: pointer;
}

/* ===== ゲームオーバー画面(クリア画面の配色を赤系に上書き) ===== */
.gameover-box {
  border-color: #ff4444;
  box-shadow: 0 0 40px rgba(255, 68, 68, 0.35);
}

.gameover-title {

    if (/[「『].+[」』]/.test(answer)) candidates = candidates.concat(TRAIT_ASIDES.quote);

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function refillQueue(avoid) {
    var pool = shuffle(ODAI_LIST.slice());
    if (avoid && pool[0] === avoid && pool.length > 1) {
      var tmp = pool[0];
      pool[0] = pool[1];
      pool[1] = tmp;
    }
    odaiQueue = pool;
  }

  function nextOdai() {
    if (odaiQueue.length === 0) refillQueue(lastOdai);
    var next = odaiQueue.shift();
    lastOdai = next;
    return next;
  }

  // ----- 簡易判定(AIが使えないログインなしの環境向けフォールバック) -----
  // 本物のAIではないが、回答の中身を簡単にチェックして点数化する。
  // 「何を書いても甘く判定される」を避けるため、以下を減点/加点する:
  //   - 短すぎる・お題の丸写し・「わからない」等の投げやりな回答 → 大きく減点
  //   - セリフ調(「」)や感嘆符など、大喜利の回答らしい書き方 → 加点
  //   - 上記に加えてランダムなブレを少し混ぜ、運の要素も残す
  var LAZY_ANSWERS = ['わからない', 'わかりません', 'ない', 'なし', '特になし', '普通', 'べつに', '知らない', 'しらない', 'なんでもいい', 'どうでもいい', 'とくになし'];

  function normalizeForCheck(str) {
    return String(str).replace(/[\s、。！？「」『』\.\,]/g, '');
  }

  function heuristicScore(odaiText, answer) {
    var score = 40; // 基礎点
    var norm = normalizeForCheck(answer);
    var len = norm.length;

    // 文字数による評価(短すぎる投げやりな回答を弾く)
    if (len < 4) score -= 35;
    else if (len < 8) score -= 12;
    else if (len >= 10 && len <= 40) score += 15;
    else if (len > 60) score -= 5;

    // お題をほぼそのまま書き写しただけの回答
    var normOdai = normalizeForCheck(odaiText);
    if (len > 3 && normOdai.indexOf(norm) !== -1) score -= 40;

    // 投げやりな定型回答
    for (var i = 0; i < LAZY_ANSWERS.length; i++) {
      if (norm === normalizeForCheck(LAZY_ANSWERS[i])) { score -= 50; break; }
    }

    // 同じ文字の連打(適当な入力)
    if (/^(.)\1{2,}$/.test(norm)) score -= 50;

    // セリフ調・強調など、大喜利らしい書き方には加点
    if (/[「『].+[」』]/.test(answer)) score += 8;
    if (/[!！?？]/.test(answer)) score += 4;

    // 運のブレ(0〜25点)。同じ傾向の回答でも毎回同じ結果にはならないようにする
    score += Math.random() * 25;

    return score;
  }

  function judgeHeuristically(odaiText, answer) {
    var score = heuristicScore(odaiText, answer);
    if (score >= 78) return 'A';
    if (score >= 55) return 'B';
    if (score >= 30) return 'C';
    return 'D';
  }

  function pickRandom(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // ----- AIに大喜利を採点してもらう(Pollinations.ai, 無料・APIキー不要・ログイン不要) -----
  // Claudeや特定のツールに依存せず、誰でも(このページを開いただけで)本物のAI採点を
  // 試みる。ただし無料の匿名アクセスは混雑時に失敗することがあるため、
  // 失敗・タイムアウト時はnullを返し、呼び出し側で簡易判定にフォールバックする。
  function extractJsonObject(text) {
    try {
      return JSON.parse(text);
    } catch (e) {
      var m = String(text).match(/\{[\s\S]*\}/);
      if (m) {
        try { return JSON.parse(m[0]); } catch (e2) { /* fallthrough */ }
      }
    }
    return null;
  }

  function judgeWithAI(odai, answer) {
    var userPrompt =
      '次の大喜利のお題とプレイヤーの回答を読み、大喜利として本当に面白いかどうかを辛口に採点して。\n' +
      '甘い採点はせず、平凡な回答・お題からズレた回答・意味不明な回答はしっかり低く評価すること。\n' +
      '本当に発想が秀逸で笑える回答だけを高く評価すること。\n\n' +
      'お題:「' + odai.text + '」\n' +
      'プレイヤーの回答:「' + answer + '」\n\n' +
      '次のJSON形式のみで出力して(説明文やコードブロックは付けない):\n' +
      '{"rank":"A","comment":"魔神ゆうとが関西弁でこの回答にツッコむ短いセリフ(20〜40文字程度)"}\n' +
      'rankは A(非常に面白い・独創的) / B(面白い) / C(普通) / D(面白くない・成立していない) のいずれか一文字。';

    var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;

    var fetchP = fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'system', content: 'あなたは大喜利ゲームに登場する魔神「ゆうと」。関西弁で話す、尊大で挑発的なキャラクター。指示されたJSON形式のみで回答すること。' },
          { role: 'user', content: userPrompt }
        ],
        temperature: 0.8
      }),
      signal: controller ? controller.signal : undefined
    })
      .then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        var parsed = content ? extractJsonObject(content) : null;
        if (!parsed) throw new Error('no json in response');
        var rank = String(parsed.rank || '').trim().toUpperCase();
        if (['A', 'B', 'C', 'D'].indexOf(rank) === -1) throw new Error('bad rank');
        var comment = typeof parsed.comment === 'string' ? parsed.comment.trim() : '';
        return { rank: rank, comment: comment || null };
      });

    var timeoutP = new Promise(function (resolve) {
      setTimeout(function () {
        if (controller) controller.abort();
        resolve(null);
      }, AI_TIMEOUT_MS);
    });

    return Promise.race([fetchP, timeoutP]).catch(function () {
      return null;
    });
  }

  // ----- 時間切れ処理 -----
  // 3回連続の不発(タイムアップ or スベり)になった瞬間だけ、魔神の本格的な反撃
  // イベント(模範回答の発表→攻撃演出→プレイヤーHP減少)を発生させる。
  // 1・2回目はテンポを落とさないよう、軽い警告だけで次の問題に進む。

    if (isJudging) return;

    submitBtn.disabled = true;

    dBadCount++;

    if (dBadCount >= MAX_D_COUNT) {

    triggerScreenShake(false);

    void rankBadge.offsetWidth;
    rankBadge.classList.add('reveal-pop');
    damageText.textContent = 'NO ANSWER';
    bossLine.textContent = '「' + softLine + '」';

    setTimeout(goToNextRound, RESULT_DISPLAY_MS);
  }

  // ----- 回答送信時の処理 -----
  function handleSubmit() {
    if (isJudging) return;

    var answer = answerInput.value.trim();
    if (answer === '') {
      answerInput.focus();
      answerInput.classList.remove('empty-warning');
      void answerInput.offsetWidth;
      answerInput.classList.add('empty-warning');
      answerInput.placeholder = '回答を入力してから送信してください！';
      return;
    }

    isJudging = true;
    stopTimer();
    submitBtn.disabled = true;
    answerInput.disabled = true;
    submitBtn.textContent = 'ジャッジ中…';
    heroEl.classList.add('judging');

    var odaiAtSubmit = currentOdai;

    judgeWithAI(odaiAtSubmit, answer).then(function (aiResult) {
      heroEl.classList.remove('judging');
      flashOverlay.classList.remove('flash-active');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-active');

      if (aiResult) {
        applyJudgeResult(aiResult.rank, aiResult.comment, answer);
      } else {
        // AI判定が使えない(未ログイン等)場合は簡易判定にフォールバック
        applyJudgeResult(judgeHeuristically(odaiAtSubmit.text, answer), null, answer);
      }
    });
  }

  // ----- 判定結果をゲームに反映 -----
  // カードは「ランク・ラベル・ダメージ数値」だけのビジュアル表示にする。
  // セリフ(AIの感想・煽り文句)は魔神の吹き出し(bossLine)だけに出し、二重表示しない。
  function applyJudgeResult(rank, aiComment, answer) {
    var info = RANK_TABLE[rank];
    var comment = aiComment || buildFallbackComment(rank, answer);

    resultArea.hidden = false;
    resultCard.className = 'result-card theme-' + rank;
    rankLabelTag.textContent = RANK_LABELS[rank];
    rankBadge.textContent = rank;
    rankBadge.className = 'rank-badge rank-' + rank;
    void rankBadge.offsetWidth;
    rankBadge.classList.add('reveal-pop');

    damageText.textContent = info.damage > 0 ? ('-' + info.damage + ' DAMAGE') : 'NO DAMAGE';
    bossLine.textContent = '「' + comment + '」';

    if (info.damage > 0) {
      // ----- 攻撃成功:魔神にダメージ。ランクごとに演出の派手さを変える -----
      currentHp = Math.max(currentHp - info.damage, 0);
      updateHpDisplay();

      heroEl.classList.remove('hit');
      void heroEl.offsetWidth;
      heroEl.classList.add('hit');
      playImpact(rank);

      if (rank === 'A') {
        // 会心の一撃:苦しそうな表情+画面全体を揺らし、金色フラッシュ・稲妻・衝撃波・パーティクル大量発生
        setHeroMood('pain');
        triggerScreenShake(true);
        triggerLightning();
        triggerShockwave('#ffd700');
        flashOverlay.classList.remove('flash-active', 'flash-gold');
        void flashOverlay.offsetWidth;
        flashOverlay.classList.add('flash-active', 'flash-gold');
        spawnParticles(22, ['#ffd700', '#ffb703', '#fff3b0', '#ff9f1c']);
      } else if (rank === 'B') {
        setHeroMood('smirk');
        triggerScreenShake(false);
        triggerShockwave('#38bdf8');
        spawnParticles(10, ['#38bdf8', '#7dd3fc', '#bae6fd']);
      } else {
        // C:手応えは薄いので衝撃波のみ。ニヤリ程度の余裕
        setHeroMood('smirk');
        triggerShockwave('#f87171');
        cMehCount++;
        updateStrikeDisplay();
      }

      if (currentHp <= 0) {
        setTimeout(playBossDefeatSequence, RESULT_DISPLAY_MS);
        return;
      }

      if (rank === 'C' && cMehCount >= MAX_C_COUNT) {
        setTimeout(function () { triggerCounterattack('C'); }, RESULT_DISPLAY_MS);
      } else {
        setTimeout(function () {
          refreshPersistentMood();
          goToNextRound();
        }, RESULT_DISPLAY_MS);
      }
      return;
    }

    // ----- 攻撃失敗(D判定):ダメージなし。魔神激怒表情+累計2回で反撃イベント -----
    setHeroMood('rage');
    triggerScreenShake(true);
    flashOverlay.classList.remove('flash-active', 'flash-counter');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('flash-active', 'flash-counter');

    dBadCount++;
    updateStrikeDisplay();

    if (dBadCount >= MAX_D_COUNT) {
      setTimeout(function () { triggerCounterattack('D'); }, 500);
    } else {
      setTimeout(function () {
        refreshPersistentMood();
        goToNextRound();
      }, RESULT_DISPLAY_MS);
    }
  }

  // ----- 魔神の反撃イベント -----
  // 「☠発表 → 怒り顔 → 攻撃モーション → 闇の魔力弾発射 → 画面揺れ → 被弾 → HP減少」
  // という流れを、文章ではなくモーションで見せる。セリフ(模範解答)は吹き出しのみ。
  // reason: 'D'(最も激しい) / 'TIMEOUT'(激しい) / 'C'(中程度)
  function triggerCounterattack(reason) {
    var lines = reason === 'C' ? C_COUNTER_LINES : (reason === 'TIMEOUT' ? TIME_UP_BOSS_LINES : D_COUNTER_LINES);
    var line = pickRandom(lines).replace('__MODEL__', currentOdai.model);
    var heavy = reason !== 'C'; // D・タイムアップはより激しい必殺技演出にする

    // フェーズ1:☠マークのみ(ビジュアル)+怒り顔。セリフは吹き出しにだけ出す
    resultArea.hidden = false;
    resultCard.className = 'result-card theme-COUNTER';
    rankLabelTag.textContent = '反撃！';
    rankBadge.textContent = '☠';
    rankBadge.className = 'rank-badge rank-TIMEOUT';
    void rankBadge.offsetWidth;
    rankBadge.classList.add('reveal-pop');
    damageText.textContent = '';
    bossLine.textContent = '「' + line + '」';

    setHeroMood('anger');

    // フェーズ2:攻撃モーション(激怒顔+踏み込みアニメ)
    setTimeout(function () {
      setHeroMood('rage');
      heroEl.classList.remove('counter-attacking');
      void heroEl.offsetWidth;
      heroEl.classList.add('counter-attacking');
      triggerLightning();
    }, 550);

    // フェーズ3:闇の魔力弾を発射→プレイヤーへ着弾
    setTimeout(function () {
      launchDarkOrb(function () {
        // ----- 着弾:画面揺れ+フラッシュ+衝撃波+プレイヤーHP減少 -----
        rankLabelTag.textContent = heavy ? '大ダメージ！！' : 'ヒット！';
        damageText.textContent = '-' + COUNTER_DAMAGE;

        flashOverlay.classList.remove('flash-active', 'flash-counter', 'flash-mega');
        void flashOverlay.offsetWidth;
        flashOverlay.classList.add('flash-active', heavy ? 'flash-mega' : 'flash-counter');

        triggerScreenShake(heavy);
        triggerLightning();
        triggerShockwave(heavy ? '#ff0000' : '#ff8844');
        if (heavy) {
          setTimeout(function () { triggerShockwave('#ff6600'); }, 120);
        }

        playerHpRow.classList.remove('hit-flash');
        void playerHpRow.offsetWidth;
        playerHpRow.classList.add('hit-flash');

        playerHp = Math.max(playerHp - COUNTER_DAMAGE, 0);
        updatePlayerHpDisplay();

        if (reason === 'C') {
          cMehCount = 0;
        } else {
          dBadCount = 0;
        }
        updateStrikeDisplay();

        setTimeout(function () {
          if (playerHp <= 0) {
            showGameOver();
          } else {
            refreshPersistentMood();
            goToNextRound();
          }
        }, COUNTER_DISPLAY_MS);
      });
    }, 850);
  }

  // ----- 演出:攻撃成功時に魔神が大げさにやられるリアクション -----
  var IMPACT_TEXTS = {
    A: ['ぐはあああっ!!', 'うおおおっ!!!'],
    B: ['うぐっ!!', 'ぬおっ!!'],
    C: ['むっ…!', 'ちっ…!']
  };

  function playImpact(rank) {
    impactText.textContent = pickRandom(IMPACT_TEXTS[rank] || IMPACT_TEXTS.C);

    impactBurst.classList.remove('play');
    void impactBurst.offsetWidth;
    impactBurst.classList.add('play');

    impactText.classList.remove('play');
    void impactText.offsetWidth;
    impactText.classList.add('play');
  }

  // ----- 演出:パーティクル(色と数を指定できるようにして、ランクごとに派手さを変える) -----
  function spawnParticles(count, colors) {
    count = count || 10;
    colors = colors || ['#ffd166'];
    for (var i = 0; i < count; i++) {
      (function (index) {
        var p = document.createElement('span');
        p.className = 'particle';
        p.style.background = colors[index % colors.length];
        particleLayer.appendChild(p);

        var angle = (Math.PI * 2 / count) * index + Math.random() * 0.4;
        var dist = 60 + Math.random() * 60;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;

        requestAnimationFrame(function () {
          p.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0.2)';
          p.style.opacity = '0';
        });

        setTimeout(function () {
          if (p.parentNode) p.parentNode.removeChild(p);
        }, 750);
      })(i);
    }
  }

  // ----- 次の問題へ -----
  function goToNextRound() {
    resultArea.hidden = true;
    isJudging = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '回答する';
    answerInput.disabled = false;
    answerInput.value = '';
    answerInput.placeholder = 'ここに面白い回答を入力…';
    charCount.textContent = '0';
    heroEl.classList.remove('counter-attacking');

    setOdai(nextOdai());
    startTimer();
  }

  // ----- 魔神撃破演出:大爆発→画面揺れ→吹き飛び→断末魔→消滅、のあとに勝利画面へ -----
  function playBossDefeatSequence() {
    stopTimer();
    resultArea.hidden = true;
    submitBtn.disabled = true;
    answerInput.disabled = true;

    setHeroMood('despair');
    bossLine.textContent = '「' + pickRandom(DEFEAT_LINES) + '」';

    heroEl.classList.remove('hit', 'counter-attacking');
    void heroEl.offsetWidth;
    heroEl.classList.add('defeated');

    // 断末魔の叫び
    screamText.classList.remove('play');
    void screamText.offsetWidth;
    screamText.classList.add('play');

    // 大爆発:フラッシュ+画面揺れ+稲妻+衝撃波を連続で叩き込む
    flashOverlay.classList.remove('flash-active', 'flash-mega');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('flash-active', 'flash-mega');
    triggerScreenShake(true);
    triggerLightning();
    triggerShockwave('#ffd700');

    setTimeout(function () {
      triggerScreenShake(true);
      triggerLightning();
      triggerShockwave('#ff6600');
      triggerShockwave('#ff2d95');
      spawnParticles(30, ['#ffd700', '#ff6600', '#ff2d95', '#fff3b0']);
    }, 550);

    setTimeout(function () {
      triggerScreenShake(false);
      triggerShockwave('#ffffff');
    }, 1300);

    setTimeout(showClear, DEFEAT_SEQUENCE_MS);
  }

  // ----- クリア画面表示(勝利演出つき) -----
  function showClear() {
    clearOverlay.hidden = false;
    flashOverlay.classList.remove('flash-active', 'flash-gold');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('flash-active', 'flash-gold');
    spawnParticles(28, ['#ffd700', '#ffb703', '#ff6ec7', '#a78bfa']);
  }

  // ----- ゲームオーバー画面表示 -----
  function showGameOver() {
    gameOverOverlay.hidden = false;
  }

  // ----- リトライ処理(共通) -----
  function resetGame() {
    currentHp = MAX_HP;
    playerHp = PLAYER_MAX_HP;
    dBadCount = 0;
    cMehCount = 0;
    updateHpDisplay();
    updatePlayerHpDisplay();
    updateStrikeDisplay();
    resultArea.hidden = true;
    clearOverlay.hidden = true;
    gameOverOverlay.hidden = true;
    isJudging = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '回答する';
    answerInput.disabled = false;
    answerInput.value = '';
    answerInput.placeholder = 'ここに面白い回答を入力…';
    charCount.textContent = '0';
    bossLine.textContent = '「フハハハハ…挑戦者よ…その大喜利、俺を笑わせることができるかな?」';
    heroEl.classList.remove('hit', 'counter-attacking', 'defeated');
    setHeroMood(null);

    lastOdai = null;
    odaiQueue = [];
    setOdai(nextOdai());
    startTimer();
  }

  // ----- イベント登録 -----
  submitBtn.addEventListener('click', handleSubmit);

  answerInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSubmit();
    }
  });

  retryBtn.addEventListener('click', resetGame);
  gameOverRetryBtn.addEventListener('click', resetGame);

  // ----- 初期表示 -----
  currentOdai = ODAI_LIST[0];
  updateHpDisplay();
  updatePlayerHpDisplay();
  updateStrikeDisplay();
  startTimer();
})();
</script>
</body>
</html>
