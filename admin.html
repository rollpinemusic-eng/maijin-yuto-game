<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>管理者統計 ～大喜利ダンジョン～</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #0d0616;
  color: #f3eefc;
  font-family: "Zen Maru Gothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.brush {
  font-family: "Yuji Syuku", "Zen Maru Gothic", serif;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 22px 16px 48px;
}

.page-title {
  margin: 0 0 2px;
  font-size: 24px;
  font-weight: 900;
  line-height: 1.2;
  background: linear-gradient(180deg, #fff3b0 0%, #ffd700 55%, #b8860b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.page-subtitle {
  margin: 0 0 20px;
  font-size: 12px;
  color: #9d8bc0;
}

/* ----- ログイン画面 ----- */
.login-card {
  border: 1px solid #ffd700;
  border-radius: 18px;
  padding: 26px 20px;
  background: linear-gradient(180deg, #241534 0%, #1a0f2e 100%);
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.16);
  text-align: center;
  margin-top: 40px;
}
.login-icon { font-size: 34px; margin-bottom: 6px; }
.login-title { margin: 0 0 4px; font-size: 17px; font-weight: 900; color: #fff; }
.login-desc { margin: 0 0 18px; font-size: 12px; color: #9d8bc0; }
.login-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid #4a2f7a;
  background: #140a24;
  color: #fff;
  font-size: 15px;
  margin-bottom: 10px;
  text-align: center;
  letter-spacing: 1px;
}
.login-input:focus { outline: none; border-color: #ffd700; }
.login-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 999px;
  font-size: 14.5px;
  font-weight: 900;
  color: #2a1400;
  background: linear-gradient(180deg, #fff3b0, #ffd700 55%, #e0ac00);
  cursor: pointer;
}
.login-error {
  margin: 10px 0 0;
  font-size: 12.5px;
  font-weight: 700;
  color: #ff8fa3;
  min-height: 1em;
}

/* ----- ダッシュボード ----- */
.dash-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.dash-actions { display: flex; gap: 8px; flex-shrink: 0; }
.dash-btn {
  border: 1px solid #8b5cf6;
  background: rgba(139, 92, 246, 0.15);
  color: #fff;
  font-size: 11.5px;
  font-weight: 900;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.dash-btn.ghost { border-color: #4a2f7a; background: transparent; color: #9d8bc0; }
.updated-at { margin: 0 0 18px; font-size: 11px; color: #6f5f8f; }

/* 集計期間の切替(全期間/公開後)。データの削除・変更は行わず、
   /statsへのリクエストに?period=を付けて集計対象を絞るだけ。 */
.period-toggle {
  display: flex;
  border: 1px solid #4a2f7a;
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
  flex-shrink: 0;
}
.period-btn {
  border: none;
  background: transparent;
  color: #9d8bc0;
  font-size: 11px;
  font-weight: 900;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.period-btn.active {
  color: #2a1400;
  background: linear-gradient(180deg, #ffd700, #b8860b);
}
.period-note { margin: 0 0 14px; font-size: 10.5px; color: #6f5f8f; }

.section {
  margin-bottom: 22px;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
  font-size: 12.5px;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: #ffd700;
}
.section-note {
  margin: -4px 0 10px;
  font-size: 10.5px;
  line-height: 1.6;
  color: #6f5f8f;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.stat-tile {
  border: 1px solid #4a2f7a;
  border-radius: 14px;
  padding: 12px 12px 11px;
  background: linear-gradient(180deg, #1a0f2e 0%, #140a24 100%);
}
.stat-tile.wide { grid-column: span 2; }
.stat-tile .label {
  margin: 0 0 4px;
  font-size: 10.5px;
  font-weight: 700;
  color: #9d8bc0;
}
.stat-tile .value {
  margin: 0;
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  font-variant-numeric: tabular-nums;
}
.stat-tile .value small { font-size: 12px; color: #b98cff; font-weight: 700; }

.bar-row { margin-bottom: 12px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-row-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #cdbdea;
  margin-bottom: 5px;
}
.bar-row-label b { color: #fff; }
.bar-track {
  height: 9px;
  border-radius: 999px;
  background: #241534;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffd700, #ff6ec7);
}

.list-card {
  border: 1px solid #4a2f7a;
  border-radius: 14px;
  background: linear-gradient(180deg, #1a0f2e 0%, #140a24 100%);
  padding: 4px 14px;
}
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(74, 47, 122, 0.5);
  font-size: 13px;
}
.list-row:last-child { border-bottom: none; }
.list-row-name { color: #e6def7; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row-name .sub { color: #6f5f8f; font-size: 11px; margin-left: 4px; }
.list-row-num { color: #fff; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list-row-num small { color: #9d8bc0; font-weight: 700; margin-left: 4px; }
.empty-note { padding: 14px 0; text-align: center; font-size: 12px; color: #6f5f8f; }

.state-box { text-align: center; padding: 40px 10px; color: #9d8bc0; font-size: 13px; }

[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page-title brush">🔥 管理者統計</h1>
  <p class="page-subtitle">このページは管理者専用です(一般プレイヤーには公開されていません)</p>

  <div id="loginView" class="login-card">
    <div class="login-icon">🔒</div>
    <p class="login-title">管理者パスワード</p>
    <p class="login-desc">統計データを見るにはパスワードが必要です</p>
    <input class="login-input" id="pwInput" type="password" placeholder="パスワード" autocomplete="off">
    <button class="login-btn" id="loginBtn" type="button">ログイン</button>
    <p class="login-error" id="loginError"></p>
  </div>

  <div id="dashView" hidden>
    <div class="dash-header">
      <div class="period-toggle" id="periodToggle">
        <button class="period-btn active" id="periodAllBtn" type="button" data-period="all">全期間</button>
        <button class="period-btn" id="periodLaunchBtn" type="button" data-period="launch">公開後</button>
      </div>
      <div class="dash-actions">
        <button class="dash-btn" id="refreshBtn" type="button">🔄 更新</button>
        <button class="dash-btn ghost" id="logoutBtn" type="button">ログアウト</button>
      </div>
    </div>
    <p class="period-note" id="periodNote"></p>
    <p class="updated-at" id="updatedAt"></p>

    <div id="dashBody">
      <div class="state-box">読み込み中…</div>
    </div>
  </div>
</div>

<script>
(function () {
  var API = 'https://maijin-yuto-ranking.rollpinemusic-173.workers.dev';
  var SESSION_KEY = 'majin_admin_pw';

  var PAGE_LABELS = {
    home: 'ホーム', stage1: 'ステージ1', stage2: 'ステージ2', stage3: 'ステージ3',
    ranking: 'ランキング', zukan: '図鑑', radio: '魔界ラジオ', help: 'ゲーム説明',
  };

  var loginView = document.getElementById('loginView');
  var dashView = document.getElementById('dashView');
  var pwInput = document.getElementById('pwInput');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');
  var refreshBtn = document.getElementById('refreshBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  var updatedAt = document.getElementById('updatedAt');
  var dashBody = document.getElementById('dashBody');
  var periodAllBtn = document.getElementById('periodAllBtn');
  var periodLaunchBtn = document.getElementById('periodLaunchBtn');
  var periodNote = document.getElementById('periodNote');

  // 集計期間(データの削除・変更は一切行わず、/statsへの問い合わせ時に
  // ?period=で絞り込むだけ)。既定は「全期間」。
  var currentPeriod = 'all';

  function getSavedPw() {
    try { return sessionStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; }
  }
  function savePw(pw) {
    try { sessionStorage.setItem(SESSION_KEY, pw); } catch (e) {}
  }
  function clearPw() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtNum(n) {
    return Number(n || 0).toLocaleString('ja-JP');
  }
  function fmtDuration(ms) {
    if (!ms || ms <= 0) return '-';
    var totalSec = Math.round(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m + '分' + (s < 10 ? '0' : '') + s + '秒';
  }
  function pct(part, total) {
    if (!total) return 0;
    return Math.round((part / total) * 1000) / 10;
  }

  function showLogin(message) {
    dashView.hidden = true;
    loginView.hidden = false;
    loginError.textContent = message || '';
  }
  function showDash() {
    loginView.hidden = true;
    dashView.hidden = false;
  }

  function fetchStats(pw, period) {
    var qs = period === 'launch' ? '?period=launch' : '';
    return fetch(API + '/stats' + qs, { headers: { 'X-Admin-Password': pw } }).then(function (res) {
      if (res.status === 401) throw new Error('unauthorized');
      if (!res.ok) throw new Error('failed');
      return res.json();
    });
  }

  function tryLogin(pw) {
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = '確認中…';
    fetchStats(pw, currentPeriod)
      .then(function (data) {
        savePw(pw);
        showDash();
        render(data);
      })
      .catch(function (err) {
        if (err.message === 'unauthorized') {
          loginError.textContent = 'パスワードが違います';
        } else {
          loginError.textContent = '通信エラーが発生しました';
        }
      })
      .finally(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'ログイン';
      });
  }

  function refresh() {
    var pw = getSavedPw();
    if (!pw) { showLogin(''); return; }
    dashBody.innerHTML = '<div class="state-box">読み込み中…</div>';
    fetchStats(pw, currentPeriod)
      .then(function (data) { render(data); })
      .catch(function (err) {
        if (err.message === 'unauthorized') {
          clearPw();
          showLogin('セッションが切れました。もう一度ログインしてください');
        } else {
          dashBody.innerHTML = '<div class="state-box">読み込みに失敗しました。電波状況をご確認のうえ、再度お試しください。</div>';
        }
      });
  }

  function statTile(label, value, opts) {
    opts = opts || {};
    return '' +
      '<div class="stat-tile' + (opts.wide ? ' wide' : '') + '">' +
      '  <p class="label">' + escapeHtml(label) + '</p>' +
      '  <p class="value">' + value + '</p>' +
      '</div>';
  }

  function barRow(leftLabel, leftCount, rightLabel, rightCount) {
    var total = leftCount + rightCount;
    var leftPct = pct(leftCount, total);
    var rightPct = pct(rightCount, total);
    return '' +
      '<div class="bar-row">' +
      '  <div class="bar-row-label"><span><b>' + escapeHtml(leftLabel) + '</b> ' + fmtNum(leftCount) + '(' + leftPct + '%)</span>' +
      '  <span>' + fmtNum(rightCount) + '(' + rightPct + '%) <b>' + escapeHtml(rightLabel) + '</b></span></div>' +
      '  <div class="bar-track"><div class="bar-fill" style="width:' + leftPct + '%"></div></div>' +
      '</div>';
  }

  function listCard(rows, renderRow) {
    if (!rows || rows.length === 0) {
      return '<div class="list-card"><p class="empty-note">まだデータがありません</p></div>';
    }
    return '<div class="list-card">' + rows.map(renderRow).join('') + '</div>';
  }

  function render(data) {
    var pv = {};
    (data.pageViews || []).forEach(function (row) { pv[row.page] = row; });
    var findCount = function (arr, key, keyName) {
      var found = (arr || []).find(function (r) { return r[keyName] === key; });
      return found ? found.count : 0;
    };
    var iphoneCount = findCount(data.platform, 'iphone', 'platform');
    var androidCount = findCount(data.platform, 'android', 'platform');
    var safariCount = findCount(data.browser, 'safari', 'browser');
    var chromeCount = findCount(data.browser, 'chrome', 'browser');

    var html = '';

    html += '<div class="section">';
    html += '  <p class="section-title">👥 プレイヤー数(ユニークユーザー)</p>';
    html += '  <p class="section-note">同じ端末からの再アクセスは1人として数えます(別ブラウザ・シークレットウィンドウは別カウントになります)</p>';
    html += '  <div class="stat-grid">';
    html += statTile('総プレイヤー数(ユニーク)', fmtNum(data.players.totalPlayed), { wide: true });
    html += statTile('今日', fmtNum(data.players.playedToday));
    html += statTile('今週', fmtNum(data.players.playedThisWeek));
    html += statTile('今月', fmtNum(data.players.playedThisMonth), { wide: true });
    html += statTile('新規ユーザー(今日)', fmtNum(data.players.newToday));
    html += statTile('再訪問ユーザー(今日)', fmtNum(data.players.returningToday));
    html += '  </div>';
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">📶 総アクセス数(のべ)</p>';
    html += '  <p class="section-note">全ページの閲覧回数の合計です。同じ人が何度も開いた分・同じページを行き来した分もすべて1件ずつ加算されるため、上のユニークユーザー数より大きくなるのが正常です。Bot/クローラーと判定した分(' + fmtNum(data.traffic.botEventsExcluded) + '件)は含みません。</p>';
    html += '  <div class="stat-grid">';
    html += statTile('総アクセス数(全ページ合計)', fmtNum(data.traffic.totalPageviews), { wide: true });
    html += '  </div>';
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">🎮 プレイ回数</p>';
    html += '  <div class="stat-grid">';
    html += statTile('総プレイ回数', fmtNum(data.plays.total), { wide: true });
    html += statTile('ステージ1', fmtNum(data.plays.byStage.stage1));
    html += statTile('ステージ2', fmtNum(data.plays.byStage.stage2));
    html += statTile('ステージ3', fmtNum(data.plays.byStage.stage3), { wide: true });
    html += '  </div>';
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">⏱ 平均プレイ時間</p>';
    html += '  <div class="list-card">';
    html += '    <div class="list-row"><span class="list-row-name">全ステージ平均</span><span class="list-row-num">' + fmtDuration(data.duration.overallAvgMs) + '<small>(n=' + fmtNum(data.duration.overallCount) + ')</small></span></div>';
    ['stage1', 'stage2', 'stage3'].forEach(function (s) {
      var d = data.duration.byStage[s] || { avgMs: 0, count: 0 };
      html += '    <div class="list-row"><span class="list-row-name">' + PAGE_LABELS[s] + '</span><span class="list-row-num">' + fmtDuration(d.avgMs) + '<small>(n=' + fmtNum(d.count) + ')</small></span></div>';
    });
    html += '  </div>';
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">📱 端末・ブラウザ比率</p>';
    html += '  <div class="list-card" style="padding:14px;">';
    html += barRow('iPhone', iphoneCount, 'Android', androidCount);
    html += barRow('Safari', safariCount, 'Chrome', chromeCount);
    html += '  </div>';
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">🌍 国別 ユニーク人数 / アクセス数</p>';
    html += listCard(data.country, function (r) {
      return '<div class="list-row"><span class="list-row-name">' + escapeHtml(r.country || '不明') + '</span><span class="list-row-num">' + fmtNum(r.uniquePlayers) + '人<small>(のべ' + fmtNum(r.count) + '件)</small></span></div>';
    });
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">📍 都道府県・地域別(取得可能な範囲)</p>';
    html += listCard(data.region, function (r) {
      return '<div class="list-row"><span class="list-row-name">' + escapeHtml(r.region || '不明') + '<span class="sub">' + escapeHtml(r.country || '') + '</span></span><span class="list-row-num">' + fmtNum(r.uniquePlayers) + '人<small>(のべ' + fmtNum(r.count) + '件)</small></span></div>';
    });
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">📄 ページ別 閲覧数</p>';
    html += listCard(data.pageViews, function (r) {
      return '<div class="list-row"><span class="list-row-name">' + (PAGE_LABELS[r.page] || r.page) + '</span><span class="list-row-num">' + fmtNum(r.views) + '<small>(ユニーク ' + fmtNum(r.uniques) + ')</small></span></div>';
    });
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">🔗 流入元</p>';
    html += listCard(data.sources, function (r) {
      return '<div class="list-row"><span class="list-row-name">' + escapeHtml(r.source) + '</span><span class="list-row-num">' + fmtNum(r.count) + '</span></div>';
    });
    html += '</div>';

    html += '<div class="section">';
    html += '  <p class="section-title">🎸 魔界ラジオ 詳細</p>';
    html += '  <div class="stat-grid">';
    html += statTile('閲覧数', fmtNum(data.radio.views));
    html += statTile('閲覧ユーザー数', fmtNum(data.radio.uniqueViewers));
    html += statTile('「音楽を聴く」クリック数', fmtNum(data.radio.musicClicks), { wide: true });
    html += statTile('「ホームページを見る」総クリック数', fmtNum(data.radio.homepageClicks));
    html += statTile('ホームページへ飛んだ人数(ユニーク)', fmtNum(data.radio.homepageUniqueClickers));
    html += '  </div>';
    html += '</div>';

    dashBody.innerHTML = html;
    updatedAt.textContent = '最終更新: ' + new Date(data.generatedAt).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });

    if (data.period === 'launch') {
      var launchLabel = data.launchAt ? new Date(data.launchAt).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) : '';
      periodNote.textContent = '🎉 正式公開(' + launchLabel + ')以降のデータのみ集計しています';
    } else {
      periodNote.textContent = 'テスト期間分も含む全期間のデータを集計しています';
    }
  }

  loginBtn.addEventListener('click', function () {
    var pw = pwInput.value;
    if (!pw) { loginError.textContent = 'パスワードを入力してください'; return; }
    tryLogin(pw);
  });
  pwInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') loginBtn.click();
  });
  refreshBtn.addEventListener('click', refresh);
  logoutBtn.addEventListener('click', function () {
    clearPw();
    pwInput.value = '';
    showLogin('');
  });

  function setPeriod(period) {
    if (period === currentPeriod) return;
    currentPeriod = period;
    periodAllBtn.classList.toggle('active', period === 'all');
    periodLaunchBtn.classList.toggle('active', period === 'launch');
    refresh();
  }
  periodAllBtn.addEventListener('click', function () { setPeriod('all'); });
  periodLaunchBtn.addEventListener('click', function () { setPeriod('launch'); });

  var savedPw = getSavedPw();
  if (savedPw) {
    showDash();
    refresh();
  } else {
    showLogin('');
  }
})();
</script>
</body>
</html>
